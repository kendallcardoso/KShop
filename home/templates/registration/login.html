{% load static %}
<!DOCTYPE html>

<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | KShop</title>
  <link rel="stylesheet" href="{% static 'registration/login.css' %}">
</head>
<body>
  <div class="login-box">
    <h1>Entrar</h1>

    {% if form.errors %}
      <p class="erro">Utilizador ou palavra-passe incorretos.</p>
    {% endif %}

    <form method="post">
      {% csrf_token %}

      <label for="username">Utilizador</label>
      <input type="text" id="username" name="username" required autofocus>

      <label for="password">Palavra-passe</label>
      <input type="password" id="password" name="password" required>

      <input type="hidden" name="next" value="{{ next }}">

      <button type="submit">Entrar</button>
    </form>
    <p style="text-align:center; margin-top:16px; font-size:0.9rem;">
        Ainda não tens conta?
        <a href="{% url 'cadastro' %}?next={{ next }}">Criar conta</a>
    </p>
    <p style="text-align:center; margin-top:16px; font-size:0.9rem;" ><a href="{% url 'produtos' %}">Voltar ao site</a></p>
  </div>
</body>
</html>
